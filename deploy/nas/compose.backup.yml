# Optional one-way disaster-recovery backup sidecar.
# Keep this separate from compose.yml so the main NAS app runs unchanged until
# the independent secrets file exists and the route/token are configured.
services:
  neo-ledger-backup-agent:
    build:
      context: ${NEO_LEDGER_SOURCE_DIR:?set NEO_LEDGER_SOURCE_DIR}/deploy/nas/backup-agent
    image: neo-ledger-backup-agent:${NEO_LEDGER_RELEASE:-latest}
    container_name: neo-ledger-backup-agent
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    env_file:
      - ${NEO_NAS_PROJECT_DIR:?set NEO_NAS_PROJECT_DIR}/.neo-ledger-backup.env
    volumes:
      - ${NEO_NAS_PROJECT_DIR:?set NEO_NAS_PROJECT_DIR}/data:/source:ro
      - ${NEO_NAS_PROJECT_DIR:?set NEO_NAS_PROJECT_DIR}/backup/nas-to-oci:/backup:rw
    networks:
      - default
