name: iOS TestFlight distribution

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build, normally a native-vX.Y.Z tag
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: neo-ledger-ios-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  testflight:
    name: Build and upload iOS/iPadOS app
    runs-on: macos-latest
    environment:
      name: ios-distribution
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Validate Apple distribution secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_TEAM_ID \
            APPSTORE_ISSUER_ID \
            APPSTORE_KEY_ID \
            APPSTORE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required iOS distribution secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile_path="$RUNNER_TEMP/neo-ledger.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$profile_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/neo-ledger-profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/neo-ledger-profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/neo-ledger-profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          printf '%s' "$profile_name" > "$RUNNER_TEMP/neo-ledger-profile-name"

      - name: Create App Store export options
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: online.eyeme.neoLedger
        run: |
          set -euo pipefail
          profile_name=$(cat "$RUNNER_TEMP/neo-ledger-profile-name")
          PROFILE_NAME="$profile_name" IOS_TEAM_ID="$IOS_TEAM_ID" IOS_BUNDLE_ID="$IOS_BUNDLE_ID" python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["PROFILE_NAME"],
              },
          }
          Path("ios/ExportOptions.plist").write_bytes(plistlib.dumps(options))
          PY

      - name: Build signed IPA
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          flutter build ipa --release --build-name "$version" --build-number "${{ github.run_number }}" --export-options-plist ios/ExportOptions.plist
          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-ios-ipa
          path: apps/native/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: apps/native/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
