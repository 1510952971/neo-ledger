name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run ga:evidence -- --mode=repository
      - run: npm run lint
      - run: npm test
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-sbom
          path: sbom.cdx.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build Android companion
        working-directory: android-companion
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
