name: Native client build and release

on:
  pull_request:
    paths:
      - 'apps/native/**'
      - '.github/workflows/native-release.yml'
  push:
    branches: [main]
    tags:
      - 'native-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-ledger-native-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  validate:
    name: Flutter analyze, test and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify native release metadata
        working-directory: .
        run: node scripts/verify-native-release-version.mjs
      - name: Verify Android companion parity
        working-directory: .
        run: node scripts/verify-native-android-companion-parity.mjs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Package Web/NAS build
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          tar -czf "neo-ledger-web-${VERSION}.tar.gz" -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-web
          path: apps/native/neo-ledger-web-*.tar.gz

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Build Android artifacts
        env:
          # Keep compatibility with the existing repository secrets while
          # allowing the documented NEO_LEDGER_* names for new repositories.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.NEO_LEDGER_ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NEO_LEDGER_ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.NEO_LEDGER_ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.NEO_LEDGER_ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          GRADLE_ARGS=("-PneoLedgerAllowDebugSigning=true")
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
            : "${ANDROID_KEYSTORE_BASE64:?Missing Android keystore base64 secret (NEO_LEDGER_ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_BASE64)}"
            : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android keystore password secret (NEO_LEDGER_ANDROID_KEYSTORE_PASSWORD or ANDROID_KEYSTORE_PASSWORD)}"
            : "${ANDROID_KEY_ALIAS:?Missing Android key alias secret (NEO_LEDGER_ANDROID_KEY_ALIAS or ANDROID_KEY_ALIAS)}"
            : "${ANDROID_KEY_PASSWORD:?Missing Android key password secret (NEO_LEDGER_ANDROID_KEY_PASSWORD or ANDROID_KEY_PASSWORD)}"
            KEYSTORE_PATH="$RUNNER_TEMP/neo-ledger-upload.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            GRADLE_ARGS=(
              "-PneoLedgerAllowDebugSigning=false"
              "-PneoLedgerKeystorePath=$KEYSTORE_PATH"
              "-PneoLedgerKeystorePassword=$ANDROID_KEYSTORE_PASSWORD"
              "-PneoLedgerKeyAlias=$ANDROID_KEY_ALIAS"
              "-PneoLedgerKeyPassword=$ANDROID_KEY_PASSWORD"
            )
          fi
          flutter build apk --release --build-name "$VERSION" --build-number "${{ github.run_number }}" "${GRADLE_ARGS[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "neo-ledger-android-${VERSION}.apk"
          flutter build appbundle --release --build-name "$VERSION" --build-number "${{ github.run_number }}" "${GRADLE_ARGS[@]}"
          cp build/app/outputs/bundle/release/app-release.aab "neo-ledger-android-${VERSION}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-android
          path: |
            apps/native/neo-ledger-android-*.apk
            apps/native/neo-ledger-android-*.aab

  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows client
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:' | ForEach-Object { $_.Line.Split(' ')[1].Split('+')[0] })
          flutter build windows --release --build-name $version --build-number ${{ github.run_number }}
      - name: Package Windows build
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.NEO_LEDGER_WINDOWS_SIGNING_CERTIFICATE_BASE64 || secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.NEO_LEDGER_WINDOWS_SIGNING_CERTIFICATE_PASSWORD || secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:' | ForEach-Object { $_.Line.Split(' ')[1].Split('+')[0] })
          $signatureStatus = 'not-required'
          $buildDir = (Resolve-Path 'build\windows\x64\runner\Release').Path
          Compress-Archive -Path "$buildDir\*" -DestinationPath "neo-ledger-windows-$version.zip"
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          $env:NEO_LEDGER_VERSION = $version
          $env:NEO_LEDGER_WINDOWS_BUILD_DIR = $buildDir
          $env:NEO_LEDGER_WINDOWS_OUTPUT_DIR = (Get-Location).Path
          & $iscc 'windows\installer\neo-ledger.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "neo-ledger-windows-$version-setup.exe"
          if (-not (Test-Path $installer)) { throw "Windows installer was not produced: $installer" }
          if ($env:GITHUB_REF -like 'refs/tags/native-v*') {
            $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
            if ($hasCertificate -xor $hasPassword) {
              throw "Windows signing requires both certificate and password secrets"
            }
            if ($hasCertificate -and $hasPassword) {
              $pfxPath = Join-Path $env:RUNNER_TEMP 'neo-ledger-signing.pfx'
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $signtool) { throw "Windows SDK signtool.exe was not found" }
              & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d "Neo Ledger" $installer
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $signature = Get-AuthenticodeSignature -FilePath $installer
              if ($signature.Status -ne 'Valid') {
                throw "Windows installer signature validation failed: $($signature.Status)"
              }
              $signatureStatus = 'valid'
            } else {
              Write-Warning "Windows signing secrets are not configured; stable release will contain an unsigned installer"
              $signatureStatus = 'unsigned'
            }
          }
          Set-Content -Path 'windows-signature-status.txt' -Value $signatureStatus -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-windows
          path: |
            apps/native/neo-ledger-windows-*.zip
            apps/native/neo-ledger-windows-*-setup.exe
            apps/native/windows-signature-status.txt

  windows-preview-release:
    name: Publish Windows preview
    if: github.ref == 'refs/heads/main'
    needs: [validate, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read native client version
        id: version
        run: |
          VERSION=$(awk '/^version:/{print $2}' apps/native/pubspec.yaml | cut -d+ -f1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: neo-ledger-windows
          path: release-assets
      - name: Prepare preview assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          test -f "neo-ledger-windows-${VERSION}.zip"
          test -f "neo-ledger-windows-${VERSION}-setup.exe"
          rm -f windows-signature-status.txt
          sha256sum -- neo-ledger-windows-*.zip neo-ledger-windows-*-setup.exe > SHA256SUMS.txt
      - name: Create or update Windows preview release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="windows-preview-v${VERSION}"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Neo Ledger Windows preview ${VERSION}" \
              --notes "Windows 预览版 ${VERSION}。该版本未配置代码签名，仅用于测试。" \
              --prerelease
          fi

  ios:
    name: iOS simulator validation (device signing required for install)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS simulator artifact
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          flutter build ios --simulator --debug --build-name "$VERSION" --build-number "${{ github.run_number }}"
          test -d build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "neo-ledger-ios-unsigned-${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-ios-unsigned
          path: apps/native/neo-ledger-ios-*.zip

  macos:
    name: macOS native app package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS client
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          flutter build macos --release \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}"
      - name: Package macOS client
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "neo-ledger-macos-${VERSION}.zip"
          hdiutil create \
            -volname "Neo Ledger ${VERSION}" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "neo-ledger-macos-${VERSION}.dmg"
          # Test packages are intentionally unsigned. Production distribution
          # should replace this marker with Developer ID signing/notarization.
          printf 'unsigned\n' > macos-signature-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-macos
          path: |
            apps/native/neo-ledger-macos-*.dmg
            apps/native/neo-ledger-macos-*.zip
            apps/native/macos-signature-status.txt

  macos-preview-release:
    name: Publish macOS preview
    if: github.ref == 'refs/heads/main'
    needs: [validate, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read native client version
        id: version
        run: |
          VERSION=$(awk '/^version:/{print $2}' apps/native/pubspec.yaml | cut -d+ -f1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: neo-ledger-macos
          path: release-assets
      - name: Prepare macOS preview assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release-assets/neo-ledger-macos-${VERSION}.dmg"
          test -f "release-assets/neo-ledger-macos-${VERSION}.zip"
          rm -f release-assets/macos-signature-status.txt
          (cd release-assets && sha256sum neo-ledger-macos-*.dmg neo-ledger-macos-*.zip > SHA256SUMS.txt)
      - name: Create or update macOS preview release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="macos-preview-v${VERSION}"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Neo Ledger macOS preview ${VERSION}" \
              --notes "macOS 预览包。当前未配置 Developer ID 签名/公证，首次安装请在 Finder 中右键应用并选择‘打开’。" \
              --prerelease
          fi

  release:
    name: Publish native release
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [validate, android, windows, ios, macos]
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches client version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#native-v}"
          PUBSPEC_VERSION=$(awk '/^version:/{print $2}' apps/native/pubspec.yaml | cut -d+ -f1)
          test "$TAG_VERSION" = "$PUBSPEC_VERSION" || {
            echo "Tag version $TAG_VERSION does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#native-v}"
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            case "$name" in
              neo-ledger-ios-unsigned-*.zip)
                echo "Keeping unsigned iOS validation artifact out of stable release: $name"
                ;;
              windows-signature-status.txt)
                echo "Using Windows signature status marker for release validation"
                ;;
              macos-signature-status.txt)
                echo "Using macOS signature status marker for release validation"
                ;;
              *)
                cp "$file" "release-assets/$name"
                ;;
            esac
          done < <(find artifacts -maxdepth 3 -type f -print0)
          signature_file=$(find artifacts -maxdepth 3 -type f -name 'windows-signature-status.txt' -print -quit)
          test -n "$signature_file"
          signature_status=$(tr -d '\r\n' < "$signature_file")
          case "$signature_status" in
            valid|unsigned) ;;
            *)
              echo "Unexpected Windows installer signature status: $signature_status"
              exit 1
              ;;
          esac
          windows_installer_signed=false
          if [ "$signature_status" = 'valid' ]; then windows_installer_signed=true; fi
          macos_signature_file=$(find artifacts -maxdepth 3 -type f -name 'macos-signature-status.txt' -print -quit)
          test -n "$macos_signature_file"
          macos_signature_status=$(tr -d '\r\n' < "$macos_signature_file")
          case "$macos_signature_status" in
            valid|unsigned) ;;
            *)
              echo "Unexpected macOS package signature status: $macos_signature_status"
              exit 1
              ;;
          esac
          macos_package_signed=false
          if [ "$macos_signature_status" = 'valid' ]; then macos_package_signed=true; fi
          for required_asset in \
            "neo-ledger-android-${VERSION}.apk" \
            "neo-ledger-android-${VERSION}.aab" \
            "neo-ledger-windows-${VERSION}.zip" \
            "neo-ledger-windows-${VERSION}-setup.exe" \
            "neo-ledger-macos-${VERSION}.dmg" \
            "neo-ledger-macos-${VERSION}.zip" \
            "neo-ledger-web-${VERSION}.tar.gz"; do
            test -f "release-assets/$required_asset" || {
              echo "Missing required native release asset: $required_asset"
              exit 1
            }
          done
          cat > release-assets/RELEASE_STATUS.json <<EOF
          {
            "schemaVersion": 1,
            "product": "Neo Ledger",
            "version": "$VERSION",
            "tag": "$GITHUB_REF_NAME",
            "channel": "stable",
            "installable": {
              "android": true,
              "windows": {
                "portable": true,
                "installer": true,
                "installerSigned": $windows_installer_signed
              },
              "macos": {
                "dmg": true,
                "portable": true,
                "packageSigned": $macos_package_signed,
                "packageNotarized": false
              },
              "web": true,
              "ios": false
            },
            "iosDistribution": "TestFlight or App Store after Apple signing",
            "macosDistribution": "DMG or app ZIP; Developer ID signing/notarization recommended"
          }
          EOF
          (
            cd release-assets
            sha256sum -- * > SHA256SUMS.txt
            for required_asset in \
              "neo-ledger-android-${VERSION}.apk" \
              "neo-ledger-android-${VERSION}.aab" \
              "neo-ledger-windows-${VERSION}.zip" \
              "neo-ledger-windows-${VERSION}-setup.exe" \
              "neo-ledger-macos-${VERSION}.dmg" \
              "neo-ledger-macos-${VERSION}.zip" \
              "neo-ledger-web-${VERSION}.tar.gz"; do
              awk -v file="$required_asset" \
                '$2 == file || $2 == "*" file { found = 1 } END { exit !found }' \
                SHA256SUMS.txt || {
                echo "Missing checksum entry for $required_asset"
                exit 1
              }
            done
            sha256sum -c SHA256SUMS.txt
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "Neo Ledger ${GITHUB_REF_NAME#native-v}" --verify-tag --generate-notes
