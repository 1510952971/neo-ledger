name: Release Android Companion

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Android release tag
        working-directory: .
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-companion/app/build.gradle.kts)
          test "${GITHUB_REF_NAME}" = "android-v${VERSION}"
      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/neo-ledger-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/neo-ledger-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Prepare release assets
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "neo-ledger-android-v${VERSION}.apk"
          sha256sum "neo-ledger-android-v${VERSION}.apk" > "neo-ledger-android-v${VERSION}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          gh release create "${GITHUB_REF_NAME}" \
            "neo-ledger-android-v${VERSION}.apk" \
            "neo-ledger-android-v${VERSION}.apk.sha256" \
            --title "Neo Ledger Android v${VERSION}" \
            --generate-notes \
            --verify-tag
