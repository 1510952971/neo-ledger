name: Build Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ledger-android-companion
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
